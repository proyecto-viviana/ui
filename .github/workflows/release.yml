name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # npm provenance (auto-enabled by OIDC trusted publishing) requires a
    # GitHub-hosted runner; Blacksmith runners are seen as "self-hosted" and
    # fail sigstore verification with E422. Release runs rarely, so the
    # Blacksmith speed loss here is immaterial.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: "pnpm"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately placed here rather than in the certification gates: it
      # simulates a publish and dirties the tree, which is safe on a fresh
      # release checkout and not somewhere a contributor wants it. A package
      # whose source moved without a changeset
      # keeps its published version, so npm serves a stale tarball under a
      # version consumers already resolve. That is invisible in-repo and only
      # breaks off-workspace, which is how ui@0.6.0 shipped importing a symbol
      # its pinned solidaria-components tarball did not have. Failing here stops
      # the release instead of shipping the skew.
      - name: guard publish-drift
        run: pnpm run guard:publish-drift

      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
