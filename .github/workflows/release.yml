name: Release

on:
  workflow_run:
    workflows: ["Certification Gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    # npm provenance (auto-enabled by OIDC trusted publishing) requires a
    # GitHub-hosted runner: a third-party runner is seen as "self-hosted" and
    # fails sigstore verification with E422.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: "pnpm"

      # Certification triggers this workflow only after it succeeds. The other
      # release gates run independently, so query Actions by the exact candidate
      # SHA and wait for all three. A green sibling run for another revision is
      # not release evidence.
      #
      # This step is the early exit, not the gate: `changeset:publish` runs the
      # same guard itself, so the local route is held to the same evidence
      # (#599). Deleting this step would only make the refusal later.
      - name: Require same-SHA release evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/check-release-evidence.mjs

      # Exact, like every `uses:` above: a range let the registry choose which
      # npm ran in the job that holds the publish token. Bump deliberately.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A git diff plus one read of the registry. It simulates no publish,
      # builds nothing and writes nothing, so the tree is as clean after this
      # step as before it — the comment that stood here justified the step's
      # placement with a publish simulation the script has never done (#598).
      # For each publishable package it asks the registry what it serves under
      # the release tag — falling back to `latest`, since a prerelease tag has
      # no release the first time it is entered — then diffs the files that
      # package's own `files` publishes against the commit that set the served
      # version. Three failures: source no changeset will ever publish, a
      # version bump the registry never received with work stacked on top of
      # it, and a tree behind what npm serves. All are invisible in-repo —
      # apps/web and
      # `pack:local-chain` build against current source — and break only
      # off-workspace, which is how ui@0.6.0 shipped importing a symbol its
      # pinned solidaria-components tarball did not have.
      #
      # It runs here, immediately before the publish it guards, because the
      # registry is half of the comparison: an answer taken on a pull request
      # hours ago describes a registry state that has since moved.
      #
      # `--version-stage` because the step below may be either stage. The
      # version stage consumes the pending changesets into the next bump, so a
      # bump the registry never received with a changeset queued on top of it is
      # the state that stage clears, not a reason to refuse it: with the flag
      # off, this step refused the only commit that could fix what it reported
      # (#598 second review). Everything else still fails here, and the publish
      # stage runs the same guard plain, inside `changeset:publish`, when there
      # is nothing left to defer to.
      - name: guard publish-drift
        run: node scripts/check-publish-drift.mjs --version-stage

      # `changeset:publish` handles npm trusted publishing (OIDC) and provenance.
      # Changesets Action v1 broke under pre-mode (ENOENT on .changeset/pre/changes.md).
      - name: Create release PR or publish packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: pnpm run changeset:publish
