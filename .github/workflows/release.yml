name: Release

on:
  workflow_run:
    workflows: ["Certification Gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    # npm provenance (auto-enabled by OIDC trusted publishing) requires a
    # GitHub-hosted runner: a third-party runner is seen as "self-hosted" and
    # fails sigstore verification with E422.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: "pnpm"

      # Certification triggers this workflow only after it succeeds. The other
      # release gates run independently, so query Actions by the exact candidate
      # SHA and wait for all three. A green sibling run for another revision is
      # not release evidence.
      #
      # This step is the early exit, not the gate: `changeset:publish` runs the
      # same guard itself, so the local route is held to the same evidence
      # (#599). Deleting this step would only make the refusal later.
      - name: Require same-SHA release evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/check-release-evidence.mjs

      # Exact, like every `uses:` above: a range let the registry choose which
      # npm ran in the job that holds the publish token. Bump deliberately.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately placed here rather than in the certification gates: it
      # simulates a publish and dirties the tree, which is safe on a fresh
      # release checkout and not somewhere a contributor wants it. A package
      # whose source moved without a changeset
      # keeps its published version, so npm serves a stale tarball under a
      # version consumers already resolve. That is invisible in-repo and only
      # breaks off-workspace, which is how ui@0.6.0 shipped importing a symbol
      # its pinned solidaria-components tarball did not have. Failing here stops
      # the release instead of shipping the skew.
      - name: guard publish-drift
        run: pnpm run guard:publish-drift

      # `changesets/action@v1` is a mutable *branch*, not a tag — every push to
      # it lands here unreviewed, in the one job that holds `contents: write`,
      # `pull-requests: write` and an npm publish token. Pinned to the commit
      # that branch head pointed at, which is the `v1.9.0` tag.
      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `changeset:publish` re-reads the same-SHA evidence before it builds
          # or publishes, so it needs the candidate SHA by name here too: the
          # `workflow_run` default of `github.sha` is the default branch head,
          # not the revision this run is releasing (#599).
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
