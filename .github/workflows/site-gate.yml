name: Site Gate

# Blocking. Everything that needs a built, served site: the accessibility gate
# and the all-routes render sweep. Mirrors `vp run ci:site`.
#
# Runs on PRs AND on push-to-main: work on this repo lands direct to main, so a
# PR-only trigger meant this gate did not run on the branch it protected. The
# 2026-07-24 audit found 12 accessibility failures on a green main branch.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-gate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec vp exec --filter @proyecto-viviana/web -- playwright install --with-deps chromium

      # Build once, then the a11y gate and the route sweep against it.
      - name: Run blocking site checks
        run: pnpm run ci:site

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-site-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/test-results
            test-results

      - name: Publish summary
        if: always()
        run: |
          echo "## Site Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Blocking, on pull requests and on push to \`main\`. Mirrors \`vp run ci:site\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **\`a11y:check\`** — the blocking AA + smoke gate. Its dedicated \`a11y:contrast\` pass checks every generated route in both themes; stricter best-practice, AAA and experimental scans remain available via \`vp run a11y:full\` (reported by _Certification Gates_)." >> "$GITHUB_STEP_SUMMARY"
          echo "- **\`test:routes\`** — every route in \`routeTree.gen.ts\` renders without hitting the error boundary. The boundary answers 200 with a full page of text, so status and byte-length checks cannot see a thrown route; asserting the boundary is absent is the whole test." >> "$GITHUB_STEP_SUMMARY"
          echo "- **\`test:seo\`** — every page carries a distinct title, description and canonical URL." >> "$GITHUB_STEP_SUMMARY"
          echo "- **\`test:api-reference\`** — the generated \`/docs\` tables render the props they generated. \`guard:api-reference\` proves the JSON matches the packages' types and \`test:routes\` proves the pages answer 200; neither can see a page that loaded its data and rendered an empty table." >> "$GITHUB_STEP_SUMMARY"
