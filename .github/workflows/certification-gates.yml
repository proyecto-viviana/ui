name: Certification Gates

# The certification gate ladder (.claude/current/certification.md).
#
# This job used to run every gate with `continue-on-error: true` and post a
# table. A gate that cannot fail is not a gate: the 2026-07-24 audit found
# format drift across 174 files, 9 docs errors and 12 a11y failures all sitting
# on a green-looking main, every one of them caught by a gate that ran here and
# was ignored.
#
# So the ladder is now split by evidence, not by ambition:
#
#   BLOCKING  — verified green locally before promotion, and
#               expected to stay green. If one of these goes red, main is red,
#               which is the entire point.
#   ADVISORY  — legitimately red today (tracked), or designed to go red on
#               someone else's schedule. `continue-on-error` stays, and the
#               reason is written next to each one. Promoting one of these
#               means closing its ticket first, not deleting its comment.
#
# Trigger: PRs AND push-to-main. Work on this repo lands direct-to-main, so a
# PR-only ladder structurally never fires (`ci-main-gate-wiring`).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification-gates:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Certified comparison no longer runs in this serial job (see the sharded
    # `certified` jobs below). Keep the remaining blocking evidence, including
    # the full axe audit, inside one hour.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      # The Adobe source/test tree is gitignored, so a normal checkout cannot
      # supply any upstream-backed evidence. Materialize the exact tracked SHA
      # and verify both package versions before a gate is allowed to run.
      - name: materialize pinned upstream oracle
        id: upstream_oracle
        run: node scripts/check-upstream-oracle.mjs --acquire

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml', 'apps/comparison/package.json') }}

      - name: Install Playwright Chromium
        run: pnpm exec vp exec --filter @proyecto-viviana/comparison -- playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # BLOCKING. Each verified green locally before promotion.
      # ---------------------------------------------------------------------

      # Keystone gate: passes today with a tracked @ts-nocheck backlog. The
      # budget immediately below prevents that blind spot from growing while
      # the burn-down ticket removes it.
      - name: typecheck
        id: typecheck
        run: pnpm run typecheck

      - name: guard ts-nocheck budget
        id: guard_ts_nocheck_budget
        run: pnpm run guard:ts-nocheck-budget

      # Negative fixtures for the control-plane guards added after the
      # 2026-08-08 incident: unavailable oracle, suppression-budget growth, and
      # failed/absent same-SHA release evidence must all produce non-zero exits.
      - name: CI guard failure contracts
        id: ci_guard_contracts
        run: pnpm run test:ci-guard-contracts

      # Formatting must block here. A non-blocking lint step once let 174 files
      # drift before the next audit detected the failure.
      - name: lint (vp check)
        id: lint
        run: pnpm exec vp check

      - name: test ssr
        id: test_ssr
        run: pnpm run test:ssr

      - name: test hydrate
        id: test_hydrate
        run: pnpm run test:hydrate

      - name: guard attribution-headers
        id: guard_attribution_headers
        run: pnpm run guard:attribution-headers

      - name: guard rac-parity
        id: guard_rac_parity
        run: pnpm run guard:rac-parity

      - name: guard rac-export-gap
        id: guard_rac_export_gap
        run: pnpm run guard:rac-export-gap

      - name: guard dnd-keyboard-parity
        id: guard_dnd_keyboard
        run: pnpm run guard:dnd-keyboard-parity

      - name: guard virtualizer-keyboard-parity
        id: guard_virtualizer_keyboard
        run: pnpm run guard:virtualizer-keyboard-parity

      # Keeps solid-spectrum and viviana-ui's @adobe/spectrum-tokens on the
      # exact version the pinned, materialized S2 oracle builds against.
      - name: guard spectrum-tokens-pin
        id: guard_tokens_pin
        run: pnpm run guard:spectrum-tokens-pin

      - name: guard style-macro-parity
        id: guard_style_macro_parity
        run: pnpm run guard:style-macro-parity

      # Generated declarations beside source can silently shadow newer .ts
      # files. Package declarations belong in dist; only the two explicit JSON
      # module shims are allowed in source trees.
      - name: guard source artifacts
        id: guard_source_artifacts
        run: pnpm run guard:source-artifacts

      # solid-spectrum ↔ viviana-ui dual-tree edge (ticket #2). Baselined
      # identical-copy backlog stays frozen; new Spectrum forks into ui fail.
      - name: guard layer-boundary
        id: guard_layer_boundary
        run: pnpm run guard:layer-boundary

      # Flags the Solid reactivity anti-pattern that has bitten this port
      # repeatedly: destructuring a component/hook's reactive `props` (freezes
      # the value, since the body runs once). Excludes the generated icon set.
      - name: guard idiomatic-solid
        id: guard_idiomatic_solid
        run: pnpm run guard:idiomatic-solid

      - name: guard invented-utilities
        id: guard_invented_utilities
        run: pnpm run guard:invented-utilities

      - name: guard docs-routes
        id: guard_docs_routes
        run: pnpm run guard:docs-routes

      # Re-derives every reference page from the packages' TypeScript types and
      # fails if the committed JSON or routes disagree. This is what makes the
      # `/docs` tree unable to advertise a prop the package does not ship —
      # the failure the hand-written solid-spectrum tables had no way to catch.
      - name: guard api-reference
        id: guard_api_reference
        run: pnpm run guard:api-reference

      # Keeps the repository slug from rotting in site links and holds every
      # published package to full npm metadata.
      - name: guard outbound-links
        id: guard_outbound_links
        run: pnpm run guard:outbound-links

      # guard:jsx-deopt-size measures the published package artifacts. Build
      # them explicitly so a clean runner proves the same evidence as a local
      # checkout with existing dist/ directories.
      - name: build package evidence
        id: build_package_evidence
        run: pnpm run build

      - name: guard jsx-deopt-size
        id: guard_jsx_deopt_size
        run: pnpm run guard:jsx-deopt-size

      - name: guard jsx-ref-dead-code
        id: guard_jsx_ref_dead_code
        run: pnpm run guard:jsx-ref-dead-code

      - name: guard upstream-test-parity
        id: guard_upstream_test_parity
        run: pnpm run guard:upstream-test-parity

      - name: docs:check
        id: docs_check
        run: pnpm run docs:check

      # Promoted 2026-08-07 (ticket #2): baselined the 9 known catalogue-depth
      # gaps. Ticket #85 owns that strict-parity backlog. New gaps outside
      # apps/comparison/scripts/parity-strict-baseline.json fail the job.
      # Use report:parity:strict --strict-full locally to see the full backlog.
      - name: comparison parity (strict)
        id: parity_strict
        run: pnpm run comparison:report:parity:strict

      # Pair, contract, and certified comparison suites run as separate jobs
      # in this workflow. Pair and contract are floors (tickets #195 / #196);
      # certified is the recertification bar (tickets #194 / #195 / #196).

      # Promoted 2026-08-08 after a complete clean run. AA and best-practice
      # findings are strict. The only attached report classes are AAA enhanced
      # contrast (beyond the WCAG 2.2 AA floor) and the exact-upstream Tag
      # focus-order semantic; every other AAA/experimental result fails.
      - name: axe full audit
        id: axe_full
        run: pnpm run a11y:full

      # ---------------------------------------------------------------------
      # ADVISORY. Red today, or red on someone else's schedule. Each one names
      # the condition under which it becomes blocking — that condition is the
      # ticket, not this comment.
      # ---------------------------------------------------------------------

      # Goes red when Adobe ships a RAC/S2 release newer than our pin. That is
      # information about upstream, not a defect in this branch, so it must not
      # block main; the response is a pin bump, not a revert. The script exits
      # 0 current / 1 behind / 2 unknown (remote unreachable); the `state`
      # output keeps "unknown" from ever rendering as a green pin (#217).
      - name: guard upstream-freshness
        id: guard_upstream_freshness
        continue-on-error: true
        run: |
          set +e
          pnpm run guard:upstream-freshness
          code=$?
          case "$code" in
            0) state=current ;;
            1) state=behind ;;
            2) state=unknown ;;
            *) state=error ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certification-gates-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            apps/comparison/playwright-report
            apps/comparison/test-results
            apps/web/playwright-report
            apps/web/test-results
            test-results

      - name: Publish summary
        if: always()
        env:
          O_TYPECHECK: ${{ steps.typecheck.outcome }}
          O_UPSTREAM_ORACLE: ${{ steps.upstream_oracle.outcome }}
          O_GUARD_TS_NOCHECK_BUDGET: ${{ steps.guard_ts_nocheck_budget.outcome }}
          O_CI_GUARD_CONTRACTS: ${{ steps.ci_guard_contracts.outcome }}
          O_LINT: ${{ steps.lint.outcome }}
          O_TEST_SSR: ${{ steps.test_ssr.outcome }}
          O_TEST_HYDRATE: ${{ steps.test_hydrate.outcome }}
          O_GUARD_ATTRIBUTION_HEADERS: ${{ steps.guard_attribution_headers.outcome }}
          O_GUARD_RAC_PARITY: ${{ steps.guard_rac_parity.outcome }}
          O_GUARD_RAC_EXPORT_GAP: ${{ steps.guard_rac_export_gap.outcome }}
          O_GUARD_DND: ${{ steps.guard_dnd_keyboard.outcome }}
          O_GUARD_VIRTUALIZER: ${{ steps.guard_virtualizer_keyboard.outcome }}
          O_GUARD_FRESHNESS_STATE: ${{ steps.guard_upstream_freshness.outputs.state }}
          O_GUARD_TOKENS_PIN: ${{ steps.guard_tokens_pin.outcome }}
          O_GUARD_STYLE_MACRO_PARITY: ${{ steps.guard_style_macro_parity.outcome }}
          O_GUARD_SOURCE_ARTIFACTS: ${{ steps.guard_source_artifacts.outcome }}
          O_GUARD_LAYER_BOUNDARY: ${{ steps.guard_layer_boundary.outcome }}
          O_GUARD_IDIOMATIC_SOLID: ${{ steps.guard_idiomatic_solid.outcome }}
          O_GUARD_INVENTED_UTILITIES: ${{ steps.guard_invented_utilities.outcome }}
          O_GUARD_DOCS_ROUTES: ${{ steps.guard_docs_routes.outcome }}
          O_GUARD_API_REFERENCE: ${{ steps.guard_api_reference.outcome }}
          O_GUARD_OUTBOUND_LINKS: ${{ steps.guard_outbound_links.outcome }}
          O_BUILD_PACKAGE_EVIDENCE: ${{ steps.build_package_evidence.outcome }}
          O_GUARD_JSX_DEOPT: ${{ steps.guard_jsx_deopt_size.outcome }}
          O_GUARD_JSX_REF_DEAD_CODE: ${{ steps.guard_jsx_ref_dead_code.outcome }}
          O_GUARD_UPSTREAM_TEST_PARITY: ${{ steps.guard_upstream_test_parity.outcome }}
          O_DOCS_CHECK: ${{ steps.docs_check.outcome }}
          O_PARITY_STRICT: ${{ steps.parity_strict.outcome }}
          O_AXE_FULL: ${{ steps.axe_full.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ pass" ;;
              failure) echo "❌ fail" ;;
              skipped) echo "⏭️ skip" ;;
              cancelled) echo "🚫 cancelled" ;;
              *) echo "▫️ $1" ;;
            esac
          }
          freshness() {
            case "$1" in
              current) echo "✅ current" ;;
              behind) echo "⚠️ behind" ;;
              unknown) echo "❔ unknown (not checked)" ;;
              *) echo "▫️ ${1:-no state}" ;;
            esac
          }
          {
            echo "## Certification Gates"
            echo ""
            echo "Runs on pull requests and on push to \`main\`. **Blocking gates fail the build.** A blocking gate that fails stops the job, so anything below it reports ⏭️ skip — fix the first ❌ and the rest will run."
            echo ""
            echo "### Blocking"
            echo ""
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| pinned upstream oracle | $(icon "$O_UPSTREAM_ORACLE") |"
            echo "| \`typecheck\` | $(icon "$O_TYPECHECK") |"
            echo "| \`guard:ts-nocheck-budget\` | $(icon "$O_GUARD_TS_NOCHECK_BUDGET") |"
            echo "| CI guard negative fixtures | $(icon "$O_CI_GUARD_CONTRACTS") |"
            echo "| \`vp check\` (lint) | $(icon "$O_LINT") |"
            echo "| \`test:ssr\` | $(icon "$O_TEST_SSR") |"
            echo "| \`test:hydrate\` | $(icon "$O_TEST_HYDRATE") |"
            echo "| \`guard:attribution-headers\` | $(icon "$O_GUARD_ATTRIBUTION_HEADERS") |"
            echo "| \`guard:rac-parity\` | $(icon "$O_GUARD_RAC_PARITY") |"
            echo "| \`guard:rac-export-gap\` | $(icon "$O_GUARD_RAC_EXPORT_GAP") |"
            echo "| \`guard:dnd-keyboard-parity\` | $(icon "$O_GUARD_DND") |"
            echo "| \`guard:virtualizer-keyboard-parity\` | $(icon "$O_GUARD_VIRTUALIZER") |"
            echo "| \`guard:spectrum-tokens-pin\` | $(icon "$O_GUARD_TOKENS_PIN") |"
            echo "| \`guard:style-macro-parity\` | $(icon "$O_GUARD_STYLE_MACRO_PARITY") |"
            echo "| \`guard:source-artifacts\` | $(icon "$O_GUARD_SOURCE_ARTIFACTS") |"
            echo "| \`guard:layer-boundary\` | $(icon "$O_GUARD_LAYER_BOUNDARY") |"
            echo "| \`guard:idiomatic-solid\` | $(icon "$O_GUARD_IDIOMATIC_SOLID") |"
            echo "| \`guard:invented-utilities\` | $(icon "$O_GUARD_INVENTED_UTILITIES") |"
            echo "| \`guard:docs-routes\` | $(icon "$O_GUARD_DOCS_ROUTES") |"
            echo "| \`guard:api-reference\` | $(icon "$O_GUARD_API_REFERENCE") |"
            echo "| \`guard:outbound-links\` | $(icon "$O_GUARD_OUTBOUND_LINKS") |"
            echo "| \`build\` (package evidence) | $(icon "$O_BUILD_PACKAGE_EVIDENCE") |"
            echo "| \`guard:jsx-deopt-size\` | $(icon "$O_GUARD_JSX_DEOPT") |"
            echo "| \`guard:jsx-ref-dead-code\` | $(icon "$O_GUARD_JSX_REF_DEAD_CODE") |"
            echo "| \`guard:upstream-test-parity\` | $(icon "$O_GUARD_UPSTREAM_TEST_PARITY") |"
            echo "| \`docs:check\` | $(icon "$O_DOCS_CHECK") |"
            echo "| \`comparison:report:parity:strict\` | $(icon "$O_PARITY_STRICT") |"
            echo "| \`a11y:full\` | $(icon "$O_AXE_FULL") |"
            echo ""
            echo "### Comparison evidence (separate jobs in this workflow)"
            echo ""
            echo "Pair and contract are **floors**, not acceptance. The recertification bar is the **certified** job."
            echo ""
            echo "| Job | Role |"
            echo "| --- | --- |"
            echo "| \`comparison floors: pair budgets\` | Floor — six-slug default-state pair-diff with mismatch budgets. Not certified D3. |"
            echo "| \`comparison floors: contracts\` | Floor — styled-contract + Button-family fixtures. Not consumed-prop certification. |"
            echo "| \`certified\` / \`certified report\` | Recertification bar. Sharded \`comparison:test:certified\`. Blocking. Waivers in \`apps/comparison/e2e/certified-waivers.json\`. |"
            echo ""
            echo "_\`typecheck\` still has a baselined 59-file \`@ts-nocheck\` blind spot across the public packages; the budget forbids additions and the burn-down ticket owns removals._"
            echo ""
            echo "_\`comparison:report:parity:strict\` is baselined (ticket #2): the known 9 catalogue-depth gaps are frozen; new gaps fail. Full backlog: \`--strict-full\`._"
            echo ""
            echo "### Advisory (does not fail the build)"
            echo ""
            echo "| Gate | Result | Why it is not blocking |"
            echo "| --- | --- | --- |"
            echo "| \`guard:upstream-freshness\` | $(freshness "$O_GUARD_FRESHNESS_STATE") | ⚠️ behind means Adobe shipped past our pin — a pin bump, not a branch defect; ❔ unknown means the remote was unreachable and the pin was not checked |"
            echo ""
            echo "_Promoting an advisory gate means closing its ticket first, not deleting its row._"
          } >> "$GITHUB_STEP_SUMMARY"

  # One package + comparison-app build, consumed by the floor jobs and every
  # certified shard. Do not rebuild inside those jobs.
  comparison-build:
    name: comparison evidence build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: certified waiver unit tests
        run: pnpm run comparison:test:certified-waivers

      - name: D13 journey driver unit tests
        run: pnpm run comparison:test:journeys-driver

      - name: build packages
        run: pnpm run build

      - name: build comparison app
        run: pnpm run comparison:build

      - name: Upload comparison dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-dist-${{ github.run_id }}
          path: |
            packages/solid-stately/dist
            packages/solidaria/dist
            packages/solidaria-components/dist
            packages/solid-spectrum/dist
            packages/kumo/dist
            packages/viviana-ui/dist
            apps/comparison/dist

  comparison-floors-pair:
    name: "comparison floors: pair budgets"
    needs: comparison-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml', 'apps/comparison/package.json') }}

      - name: Install Playwright Chromium
        run: pnpm exec vp exec --filter @proyecto-viviana/comparison -- playwright install --with-deps chromium

      - name: Restore comparison dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: comparison-dist-${{ github.run_id }}
          path: .

      - name: comparison floors pair
        working-directory: apps/comparison
        run: pnpm exec playwright test e2e/default-state-pair-diff.spec.ts --reporter=line

      - name: Upload pair reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-floors-pair-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            apps/comparison/playwright-report
            apps/comparison/test-results

      - name: Publish floor summary
        if: always()
        run: |
          {
            echo "## Comparison floors: pair budgets"
            echo ""
            echo "This job is a **floor**, not acceptance. It runs the six-slug default-state pair-diff with asserted mismatch budgets (ticket #195)."
            echo ""
            echo "A 40% mismatch budget here does not certify a component. The recertification bar is the **certified** job in this workflow (sharded \`comparison:test:certified\`, D3 at exact pair-diff)."
            echo ""
            echo "Floors are necessary and nowhere near sufficient. See \`.claude/current/certification.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  comparison-floors-contract:
    name: "comparison floors: contracts"
    needs: comparison-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml', 'apps/comparison/package.json') }}

      - name: Install Playwright Chromium
        run: pnpm exec vp exec --filter @proyecto-viviana/comparison -- playwright install --with-deps chromium

      - name: Restore comparison dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: comparison-dist-${{ github.run_id }}
          path: .

      - name: comparison floors contract
        working-directory: apps/comparison
        run: pnpm exec playwright test e2e/styled-contract.spec.ts e2e/button-family-contract.spec.ts --reporter=line

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-floors-contract-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            apps/comparison/playwright-report
            apps/comparison/test-results

      - name: Publish floor summary
        if: always()
        run: |
          {
            echo "## Comparison floors: contracts"
            echo ""
            echo "This job is a **floor**, not acceptance. It runs the styled-contract smoke plus the Button-family fixtures (ticket #196)."
            echo ""
            echo "Canvas visibility and \`data-comparison-contract\` are plumbing. The recertification bar is the **certified** job in this workflow (sharded \`comparison:test:certified\`)."
            echo ""
            echo "Floors are necessary and nowhere near sufficient. See \`.claude/current/certification.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Shard estimate (2026-09-02): the full certified suite is 72 specs / ~2124
  # tests / ~28 min at 8 workers locally. Shard 1/8 with --workers=2 ran in
  # 9.8 minutes on this host (201 passed / 64 failed / 1 skipped — failures
  # are the ticketed React 1.7.0 pin until #240). 4 vCPU (ubuntu-latest and
  # blacksmith-4vcpu) caps workers at 2 beside the preview server. n=8 keeps
  # each shard at or under 10 minutes.
  certified:
    name: certified (${{ matrix.shard }}/8)
    needs: comparison-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml', 'apps/comparison/package.json') }}

      - name: Install Playwright Chromium
        run: pnpm exec vp exec --filter @proyecto-viviana/comparison -- playwright install --with-deps chromium

      - name: Restore comparison dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: comparison-dist-${{ github.run_id }}
          path: .

      - name: certified shard
        id: certified_shard
        continue-on-error: true
        working-directory: apps/comparison
        run: pnpm exec playwright test e2e/certified --shard=${{ matrix.shard }}/8 --workers=2

      - name: Upload certified shard reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certified-shard-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            apps/comparison/blob-report
            apps/comparison/test-results/certified-summary.json
            apps/comparison/test-results/certified-summary.*.json

  certified-report:
    name: certified report
    needs: [comparison-build, certified]
    if: ${{ always() && needs.comparison-build.result == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CERTIFIED_SHARD_TOTAL: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download certified shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: certified-shard-*
          path: certified-shards

      - name: Merge certified reports
        run: pnpm exec tsx apps/comparison/scripts/merge-certified-reports.ts certified-shards

      - name: Upload certified HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certified-html-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            apps/comparison/playwright-report
            apps/comparison/test-results/certified-summary.json
            apps/comparison/test-results/certified-summary.md
