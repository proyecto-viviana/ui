packages:
  - "packages/*"
  - "apps/web"
  - "apps/comparison"

# pnpm 11 no longer reads package.json#pnpm. Keep the dependency policy here,
# where both local installs and CI consume it.
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  ws: "^8.21.3"
  fast-uri: "^3.1.6"
  browserslist: "^4.28.7"
  brace-expansion: "^5.0.9"
  yaml: "^2.9.0"
  undici: "^7.29.0"
  js-yaml: "^4.3.1"
  read-yaml-file: "2.1.0"
  esbuild: "^0.28.2"
  "@babel/core": "^7.29.6"
  "@tsdown/css": "0.22.14"

# Native build hooks are denied unless explicitly trusted here. These three
# install platform binaries required by the repository's macro, bundler, and
# Cloudflare toolchains.
allowBuilds:
  "@swc/core": true
  esbuild: true
  workerd: true

# Exact, reviewable exceptions for the 2026-08-19 dependency refresh. pnpm 11
# otherwise rejects lockfile entries published less than 24 hours ago. Exact
# selectors preserve the quarantine for every future version of these packages.
minimumReleaseAgeExclude:
  - "@astrojs/internal-helpers@0.10.3"
  - "@astrojs/markdown-satteri@0.3.6"
  - "@astrojs/react@6.0.3"
  - "@changesets/cli@3.0.1"
  - "@changesets/write@1.0.1"
  - "@cloudflare/kumo@2.11.0"
  - "@cloudflare/vite-plugin@1.53.0"
  - "@tanstack/router-core@1.171.26"
  - "@tanstack/router-generator@1.167.32"
  - "@tanstack/router-plugin@1.168.34"
  - "@tanstack/solid-router@1.170.29"
  - "@tanstack/solid-start-client@1.168.28"
  - "@tanstack/solid-start-server@1.167.35"
  - "@tanstack/solid-start@1.168.46"
  - "@tanstack/start-client-core@1.170.26"
  - "@tanstack/start-plugin-core@1.171.38"
  - "@tanstack/start-server-core@1.169.30"
  - "@tanstack/start-storage-context@1.167.28"
  - "astro@7.2.3"
  - "human-id@4.2.1"
  - "magic-string@1.2.1"
  - "miniflare@5.20260815.0-alpha"
  - "wrangler@4.124.0"
  - "@internationalized/date@3.12.4"
  - "@internationalized/number@3.6.8"
  - "@react-spectrum/s2@1.7.0"
  - react-aria-components@1.21.0
  - react-aria@3.52.0
  - react-stately@3.50.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
